name: Bug report
description: Report a reproducible problem
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include steps, expected behavior, and actual behavior. Never paste clipboard secrets.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and desktop session
      placeholder: e.g. Ubuntu 24.04 / GNOME Wayland
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Build version or commit
