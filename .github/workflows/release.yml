name: Source release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish as a source release
        required: true
        type: string

permissions:
  contents: write

jobs:
  source-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ qt6-base-dev qt6-declarative-dev libsqlite3-dev
      - name: Build and test
        run: |
          cmake --preset release
          cmake --build --preset release
          ctest --preset release
      - name: Verify tag and publish source release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git rev-parse --verify "refs/tags/$RELEASE_TAG"
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes "Source-only release. Installers are not available yet."
